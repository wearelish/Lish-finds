# LishFind CI Pipeline
# Continuous Integration workflow for automated testing and quality checks

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Backend Testing and Quality Checks
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: lishfind_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Set up test environment
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lishfind_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-32-chars-long
          ENVIRONMENT: test
          DEBUG: true
        run: |
          # Copy test environment file
          cp .env.example .env.test
          
          # Run database migrations
          python -m alembic upgrade head
      
      - name: Run linting
        working-directory: ./backend
        run: |
          # Black formatting check
          black --check --diff .
          
          # isort import sorting check
          isort --check-only --diff .
          
          # flake8 linting
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run type checking
        working-directory: ./backend
        run: |
          mypy . --ignore-missing-imports --no-strict-optional
      
      - name: Run security checks
        working-directory: ./backend
        run: |
          # Safety - check for known security vulnerabilities
          safety check
          
          # Bandit - security linting
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll
      
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lishfind_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-32-chars-long
          ENVIRONMENT: test
          DEBUG: true
        run: |
          # Run tests with coverage
          pytest --cov=. --cov-report=xml --cov-report=html --cov-fail-under=80 -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/htmlcov/
            backend/bandit-report.json
            backend/coverage.xml

  # Frontend Testing and Quality Checks
  frontend-tests:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
      
      - name: Run linting
        working-directory: ./frontend
        run: |
          # ESLint for JavaScript
          npx eslint . --ext .js,.html --format json --output-file eslint-report.json || true
          npx eslint . --ext .js,.html
      
      - name: Run HTML validation
        working-directory: ./frontend
        run: |
          # HTML5 validation
          npx html-validate *.html
      
      - name: Run accessibility tests
        working-directory: ./frontend
        run: |
          # Pa11y accessibility testing
          npx pa11y-ci --sitemap http://localhost:3000/sitemap.xml --reporter cli || true
      
      - name: Build frontend
        working-directory: ./frontend
        run: |
          # Simple build check (since it's static HTML)
          echo "Frontend build completed successfully"
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: python, javascript

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: lishfind-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: lishfind-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker Compose
        run: |
          # Test docker-compose configuration
          docker-compose -f docker-compose.yml config
          docker-compose -f docker-compose.staging.yml config
          docker-compose -f docker-compose.production.yml config

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, docker-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Start test environment
        run: |
          # Start services for integration testing
          docker-compose -f docker-compose.yml up -d --build
          
          # Wait for services to be ready
          sleep 30
          
          # Health check
          curl -f http://localhost:8001/health || exit 1
          curl -f http://localhost:3000/health || exit 1
      
      - name: Run API integration tests
        run: |
          # Test API endpoints
          curl -f http://localhost:8001/api/v1/health
          curl -f http://localhost:8001/docs
          
          # Test frontend
          curl -f http://localhost:3000/
      
      - name: Stop test environment
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Start application
        run: |
          docker-compose -f docker-compose.yml up -d --build
          sleep 30
      
      - name: Run performance tests
        run: |
          k6 run --out json=performance-results.json tests/performance/load-test.js || true
      
      - name: Upload performance results
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: performance-results.json

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, docker-build]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "Frontend tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "Security scan failed"
            exit 1
          fi
          
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Docker build failed"
            exit 1
          fi
          
          echo "All quality checks passed!"

  # Notification
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: always() && github.event_name == 'push'
    
    steps:
      - name: Notify success
        if: needs.quality-gate.result == 'success'
        run: |
          echo "✅ CI Pipeline completed successfully for ${{ github.ref }}"
      
      - name: Notify failure
        if: needs.quality-gate.result != 'success'
        run: |
          echo "❌ CI Pipeline failed for ${{ github.ref }}"