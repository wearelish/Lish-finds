# LishFind Release Pipeline
# Automated release creation and changelog generation

name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Create release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install release tools
        run: |
          pip install bump2version
          npm install -g conventional-changelog-cli
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bump version in files
          bump2version $RELEASE_TYPE --tag --commit
          
          # Push changes
          git push origin main --tags
      
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog since last tag
          if git describe --tags --abbrev=0 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            echo "Generating changelog since $LAST_TAG"
            
            # Generate conventional changelog
            conventional-changelog -p angular -i CHANGELOG.md -s -r 2
            
            # Extract latest changelog section
            CHANGELOG=$(sed -n "/^## \[/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)
          else
            echo "No previous tags found, generating full changelog"
            conventional-changelog -p angular -i CHANGELOG.md -s
            CHANGELOG=$(sed -n "/^## \[/,/^## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)
          fi
          
          # Save changelog to output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          PRERELEASE_FLAG=""
          
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # Create release
          gh release create "$VERSION" \
            --title "LishFind $VERSION" \
            --notes "$CHANGELOG" \
            $PRERELEASE_FLAG \
            --latest
      
      - name: Commit changelog
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ steps.version.outputs.version }}" || exit 0
          git push origin main

  # Build release artifacts
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Build backend package
        working-directory: ./backend
        run: |
          # Install build dependencies
          pip install build setuptools wheel
          
          # Create source distribution
          python -m build --sdist --wheel
          
          # Create deployment package
          mkdir -p ../dist/backend
          cp -r . ../dist/backend/
          
          # Remove development files
          rm -rf ../dist/backend/.git*
          rm -rf ../dist/backend/__pycache__
          rm -rf ../dist/backend/.pytest_cache
          
          # Create tarball
          cd ../dist
          tar -czf lishfind-backend-${{ needs.create-release.outputs.version }}.tar.gz backend/
      
      - name: Build frontend package
        working-directory: ./frontend
        run: |
          # Create deployment package
          mkdir -p ../dist/frontend
          cp -r . ../dist/frontend/
          
          # Remove development files
          rm -rf ../dist/frontend/.git*
          rm -rf ../dist/frontend/node_modules
          
          # Create tarball
          cd ../dist
          tar -czf lishfind-frontend-${{ needs.create-release.outputs.version }}.tar.gz frontend/
      
      - name: Create deployment configuration package
        run: |
          mkdir -p dist/deployment
          cp -r deployment/* dist/deployment/
          cp -r monitoring dist/deployment/
          cp docker-compose*.yml dist/deployment/
          cp -r nginx dist/deployment/
          cp -r scripts dist/deployment/
          
          cd dist
          tar -czf lishfind-deployment-${{ needs.create-release.outputs.version }}.tar.gz deployment/
      
      - name: Generate checksums
        working-directory: ./dist
        run: |
          sha256sum *.tar.gz > checksums.sha256
          md5sum *.tar.gz > checksums.md5
      
      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          
          # Upload artifacts to release
          gh release upload "$VERSION" \
            dist/lishfind-backend-$VERSION.tar.gz \
            dist/lishfind-frontend-$VERSION.tar.gz \
            dist/lishfind-deployment-$VERSION.tar.gz \
            dist/checksums.sha256 \
            dist/checksums.md5

  # Build and push Docker images for release
  build-release-images:
    name: Build Release Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract version
        id: version
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.tag }}
            lishfind/backend:latest
            lishfind/backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.tag }}
            lishfind/frontend:latest
            lishfind/frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Update documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update version in documentation
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          
          # Update README.md
          sed -i "s/Version: .*/Version: $VERSION/" README.md
          
          # Update deployment docs
          find docs/ -name "*.md" -exec sed -i "s/lishfind:v[0-9.]\+/lishfind:$VERSION/g" {} \;
          
          # Update Docker Compose files with new image tags
          sed -i "s/lishfind\/backend:.*/lishfind\/backend:$VERSION/" docker-compose*.yml
          sed -i "s/lishfind\/frontend:.*/lishfind\/frontend:$VERSION/" docker-compose*.yml
      
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git commit -m "docs: update version to ${{ needs.create-release.outputs.version }}" || exit 0
          git push origin main

  # Deploy release to production
  deploy-release:
    name: Deploy Release to Production
    uses: ./.github/workflows/cd.yml
    needs: [create-release, build-release-images]
    with:
      environment: production
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  # Notify stakeholders
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-artifacts, build-release-images, deploy-release]
    if: always()
    
    steps:
      - name: Send release notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ needs.create-release.outputs.version }}
          CHANGELOG: ${{ needs.create-release.outputs.changelog }}
        run: |
          # Prepare notification message
          MESSAGE="🎉 LishFind $VERSION has been released!\n\n**Changes:**\n$CHANGELOG\n\n**Download:** https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          
          # Send to Slack
          if [[ -n "$SLACK_WEBHOOK" ]]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"'"$MESSAGE"'"}' \
              "$SLACK_WEBHOOK"
          fi
          
          # Send to Discord
          if [[ -n "$DISCORD_WEBHOOK" ]]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"content":"'"$MESSAGE"'"}' \
              "$DISCORD_WEBHOOK"
          fi