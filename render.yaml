# Render.com Blueprint for LishFind Application
# Deploy backend, frontend, and database together

services:
  # Backend API Service
  - type: web
    name: lishfind-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter  # Free tier
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: lishfind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lishfind-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
        length: 64
      - key: CORS_ORIGINS
        value: https://lishfind-frontend.onrender.com
      - key: ALLOWED_HOSTS
        value: lishfind-backend.onrender.com
      - key: AI_PROVIDER
        value: disabled  # Free tier - no AI costs
      - key: MAPS_PROVIDER
        value: nominatim  # Free tier - no Google Maps costs
      - key: STORAGE_TYPE
        value: local
      - key: EMAIL_ENABLED
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
    healthCheckPath: /health
    
  # Frontend Service
  - type: web
    name: lishfind-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter  # Free tier
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: lishfind-backend
          property: host
    healthCheckPath: /health

databases:
  # PostgreSQL Database
  - name: lishfind-db
    databaseName: lishfind_prod
    user: lishfind
    plan: starter  # Free tier
    region: oregon
    postgresMajorVersion: 15

  # Redis Cache
  - name: lishfind-redis
    plan: starter  # Free tier
    region: oregon
    maxmemoryPolicy: allkeys-lru