# Redis configuration for development

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (for development - you may want to disable this in production cache-only setups)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Security (development only - use proper auth in production)
# requirepass your-redis-password

# Performance
tcp-keepalive 300
timeout 0

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""