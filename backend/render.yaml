# Render.com deployment configuration for LishFind Backend
services:
  - type: web
    name: lishfind-backend
    env: python
    region: oregon
    plan: starter  # Free tier
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: disabled
      - key: MAPS_PROVIDER
        value: nominatim
      - key: STORAGE_TYPE
        value: local
      - key: EMAIL_ENABLED
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
      - key: CORS_ORIGINS
        value: https://lishfind-frontend.vercel.app,http://localhost:3000
      - key: ALLOWED_HOSTS
        value: lishfind-backend.onrender.com,localhost
      - key: REDIS_URL
        value: ""
    healthCheckPath: /health
    autoDeploy: true