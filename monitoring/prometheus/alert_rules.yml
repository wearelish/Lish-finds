# Prometheus alerting rules for LishFind application

groups:
  - name: lishfind.rules
    rules:
      # Application Health Alerts
      - alert: LishFindApplicationDown
        expr: up{job="lishfind-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: lishfind-backend
        annotations:
          summary: "LishFind application is down"
          description: "LishFind backend application has been down for more than 1 minute."

      # High Error Rate Alert
      - alert: HighErrorRate
        expr: (rate(http_request_errors_total{job="lishfind-backend"}[5m]) / rate(http_requests_total{job="lishfind-backend"}[5m])) * 100 > 10
        for: 2m
        labels:
          severity: warning
          service: lishfind-backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% for the last 5 minutes."

      # High Response Time Alert
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_ms_bucket{job="lishfind-backend"}[5m])) > 2000
        for: 3m
        labels:
          severity: warning
          service: lishfind-backend
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}ms for the last 5 minutes."

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: system_cpu_usage_percent{job="lishfind-backend"} > 80
        for: 5m
        labels:
          severity: warning
          service: lishfind-backend
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: system_memory_usage_percent{job="lishfind-backend"} > 85
        for: 3m
        labels:
          severity: warning
          service: lishfind-backend
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% for more than 3 minutes."

      - alert: HighDiskUsage
        expr: system_disk_usage_percent{job="lishfind-backend"} > 90
        for: 1m
        labels:
          severity: critical
          service: lishfind-backend
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value }}% - running out of space."

      # Database Alerts
      - alert: DatabaseConnectionPoolExhausted
        expr: database_connection_pool_active{job="lishfind-backend"} >= database_connection_pool_size{job="lishfind-backend"}
        for: 2m
        labels:
          severity: critical
          service: lishfind-database
        annotations:
          summary: "Database connection pool exhausted"
          description: "All database connections are in use."

      - alert: SlowDatabaseQueries
        expr: database_query_duration_p95{job="lishfind-backend"} > 1000
        for: 5m
        labels:
          severity: warning
          service: lishfind-database
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile database query time is {{ $value }}ms."

      # Traffic Alerts
      - alert: NoTraffic
        expr: rate(http_requests_total{job="lishfind-backend"}[10m]) < 0.01
        for: 10m
        labels:
          severity: warning
          service: lishfind-backend
        annotations:
          summary: "No traffic to application"
          description: "No HTTP requests received for the last 10 minutes."

      - alert: UnusualTrafficSpike
        expr: rate(http_requests_total{job="lishfind-backend"}[5m]) > (avg_over_time(rate(http_requests_total{job="lishfind-backend"}[5m])[1h:5m]) * 5)
        for: 2m
        labels:
          severity: warning
          service: lishfind-backend
        annotations:
          summary: "Unusual traffic spike detected"
          description: "Traffic is 5x higher than normal average."

  - name: lishfind.infrastructure
    rules:
      # Infrastructure Health
      - alert: PostgreSQLDown
        expr: up{job="lishfind-postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: lishfind-postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding."

      - alert: RedisDown
        expr: up{job="lishfind-redis"} == 0
        for: 1m
        labels:
          severity: warning
          service: lishfind-redis
        annotations:
          summary: "Redis is down"
          description: "Redis cache is not responding. Application may experience degraded performance."

      # Node/System Alerts
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: "Node Exporter is down"
          description: "Cannot collect system metrics from node exporter."